name: build-image

# 为什么在 GitHub Actions 里构建
# --------------------------------
# 本地是 Windows（没有 WSL2，Docker Desktop 起不来）；AMD 那台是 k8s pod
#（`no docker` / `no podman` / 无 `/var/run/docker.sock`，不是特权容器）。
# 也就是说**没有任何一台手边的机器能执行 `docker build`**，而自动评测 70 分全靠镜像。
# `ubuntu-latest` runner 自带 docker daemon，是当前唯一可用的构建机。
#
# 用法
# ----
#   Actions → build-image → Run workflow
#     team_name: 报名队名（决定 /root/AI技术赛道-数字人综合情感对话模型-<队名>/）
#     push_image: 构建通过后是否推到 ghcr.io
#
# 本地等价命令（在一台有 docker 的 Linux 上）：
#   python3 tools/fetch_model.py && bash deploy/build.sh

on:
  workflow_dispatch:
    inputs:
      team_name:
        description: "报名队名（用于专家评审材料目录名）"
        required: false
        default: "OGC"
      push_image:
        description: "构建+自检通过后推送到 ghcr.io"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 磁盘现状
        run: |
          df -h /
          docker version --format '{{.Server.Version}}' || true

      - name: 释放磁盘（镜像约 10 GB，层最坏堆到 25 GB）
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      # 构建之前先跑测试。这一步很便宜（十几秒），但它把「能构建」和「测试是绿的」
      # 绑在一起 —— 原先工作流完全不跑测试，一个把 tests 打红的提交照样能产出可交付镜像。
      - name: 跑测试
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m pytest

      - name: 拉模型权重（Qwen2.5-3B-Instruct，5.76 GB，支持断点续传）
        run: |
          python3 -V
          python3 tools/fetch_model.py
          ls -l GivenData/participant/model/ | head -20
          du -sh GivenData/participant/model/

      - name: 组装暂存目录 + 构建镜像 + 离线自检
        env:
          TEAM_NAME: ${{ inputs.team_name }}
        run: |
          bash deploy/build.sh
        # build.sh 内部依次执行：
        #   1) 校验权重 2) 组装 deploy/dist/context 3) 清单
        #   4) docker build 5) docker run --rm --network none ... /opt/offline_check.sh

      - name: 镜像信息
        if: always()
        run: |
          docker images | head -10
          docker image inspect ogc-participant:latest --format '{{.Size}}' 2>/dev/null || true
          df -h /

      # 交付物：一个能 `docker load` 回去的 tar。
      # 压缩用 gzip -1（不是 -9）：镜像里大头是 bf16 权重，压不动，-9 只多花几分钟换几个百分点。
      # 现代 docker 支持 `docker load -i xxx.tar.gz`，不用先解压。
      - name: 导出镜像 tar.gz
        id: export
        run: |
          set -eux
          OUT="ogc-participant-OGC.tar.gz"
          docker save ogc-participant:latest | gzip -1 > "$OUT"
          ls -l "$OUT"
          du -h "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          df -h /

      # 出厂前验一遍镜像内容。2026-10-17 那次就是「构建全绿、镜像能跑」，
      # 但评审材料里少了一份评测台账 —— 只有把 tar 打开看才会发现。
      # 这里断言的东西恰好是专家评审要读的路径，缺一个就让构建失败。
      - name: 检查镜像内容（评审材料 / 入口脚本 / 权重）
        run: |
          set -eux
          python3 tools/inspect_image_tar.py ogc-participant-OGC.tar.gz \
            --expect /root/participant/start.sh \
            --expect /root/participant/run_inference.py \
            --expect /root/participant/model/config.json \
            --expect /opt/offline_check.sh \
            --expect "/root/AI技术赛道-数字人综合情感对话模型-${TEAM_NAME}/01-technical-plan.md" \
            --expect "/root/AI技术赛道-数字人综合情感对话模型-${TEAM_NAME}/02-experiments.md" \
            --expect "/root/AI技术赛道-数字人综合情感对话模型-${TEAM_NAME}/03-reproduce.md" \
            --expect "/root/AI技术赛道-数字人综合情感对话模型-${TEAM_NAME}/06-leaderboard.tsv" \
            --json-out image-inspect.json
        env:
          TEAM_NAME: ${{ inputs.team_name }}

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: ogc-participant-image
          path: |
            ogc-participant-OGC.tar.gz
            ogc-participant-OGC.tar.gz.sha256
            image-inspect.json
          retention-days: 7
          compression-level: 0   # 已经是 gzip，别让 artifact 再套一层

      - name: 推送到 ghcr.io（可选）
        if: ${{ inputs.push_image == true }}
        run: |
          set -eux
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ogc-participant:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ogc-participant:latest "$IMAGE"
          docker push "$IMAGE"
          echo "已推送：$IMAGE"
